name: Build ProVerb Windows & macOS Installers

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Universal Installer (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28'

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build All Targets (VST3)
        run: cmake --build build --config Release --parallel

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile Inno Setup Windows Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "Installer\Windows\ProVerb_Windows_Installer.iss"

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProVerb-Windows-Installer
          path: Output/ProVerb.exe

  build-macos:
    name: Build macOS Universal PKG & DMG (.pkg, .dmg)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28'

      - name: Make Build Script Executable
        run: |
          chmod +x Installer/macOS/build_mac_installer.sh
          chmod +x "Installer/macOS/Uninstall ProVerb.command"

      - name: Build Universal VST3, AU & AAX and Package .pkg & .dmg
        run: ./Installer/macOS/build_mac_installer.sh

      - name: Upload macOS Installer Package (.pkg)
        uses: actions/upload-artifact@v4
        with:
          name: ProVerb-macOS-PKG
          path: Output/ProVerb.pkg

      - name: Upload macOS Disk Image (.dmg)
        uses: actions/upload-artifact@v4
        with:
          name: ProVerb-macOS-DMG
          path: Output/ProVerb.dmg
