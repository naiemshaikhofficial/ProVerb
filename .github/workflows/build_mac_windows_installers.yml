name: Build ProVerb Windows & macOS Installers

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Universal PKG & DMG (.pkg, .dmg)
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake (Universal arm64 + x86_64)
        run: |
          cmake -B build_mac \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
                -DCMAKE_OSX_DEPLOYMENT_TARGET="10.15"

      - name: Build ProVerb Universal VST3 Plugin
        run: cmake --build build_mac --config Release --target ProVerb_VST3 --parallel

      - name: Build ProVerb Universal Audio Unit (AU) Plugin
        run: cmake --build build_mac --config Release --target ProVerb_AU --parallel

      - name: Assemble Apple PKG & Branded DMG Installer
        run: |
          chmod +x Installer/macOS/build_mac_installer.sh
          chmod +x "Installer/macOS/Uninstall ProVerb.command"
          ./Installer/macOS/build_mac_installer.sh --skip-build

      - name: Upload macOS Installer Package (.pkg)
        uses: actions/upload-artifact@v4
        with:
          name: ProVerb-macOS-PKG
          path: Output/ProVerb.pkg

      - name: Upload macOS Disk Image (.dmg)
        uses: actions/upload-artifact@v4
        with:
          name: ProVerb-macOS-DMG
          path: Output/ProVerb.dmg

      - name: Upload macOS Checksums
        uses: actions/upload-artifact@v4
        with:
          name: ProVerb-macOS-Checksums
          path: Output/ProVerb_macOS_SHA256.txt

  build-windows:
    name: Build Windows Universal Installer (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -B build -S .

      - name: Build VST3 Plugin
        run: cmake --build build --config Release --target ProVerb_VST3 --parallel

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile Inno Setup Windows Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "Installer\Windows\ProVerb_Windows_Installer.iss"

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProVerb-Windows-Installer
          path: Output/ProVerb.exe

  publish-release:
    name: Publish Multiplatform GitHub Release
    needs: [ build-macos, build-windows ]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ProVerb Production Release ${{ github.ref_name }}"
          files: |
            release_assets/ProVerb.dmg
            release_assets/ProVerb.pkg
            release_assets/ProVerb_macOS_SHA256.txt
            release_assets/ProVerb.exe
          generate_release_notes: true
          draft: false
          prerelease: false
